version: 2
updates:
  # GitHub Actions in the workflows — kept pinned to commit SHAs (version in the
  # trailing comment); Dependabot bumps the SHA + comment on new releases.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

# Binary/package pins, the socket-proxy digest, and Ansible Galaxy collections
# are updated manually. The YubiKey plugin also has its upstream sync workflow.
