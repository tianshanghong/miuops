---
# cloudflared default variables
cloudflared_dir: "/opt/cloudflared"
# The official deb installs here; never execute an older manual /usr/local copy.
cloudflared_bin: "/usr/bin/cloudflared"
# Local path to a tunnel credential the CONTROL node decrypted from
# fleet/secrets/<tunnel_id>.json (SOPS+age). The miuops CLI sets this via
# `-e cloudflared_credentials_src=<temp>` so the server receives the plaintext
# JSON over SSH, never the age key. When empty, fall back to the legacy
# plaintext at {{ playbook_dir }}/files/<tunnel_id>.json for backward-compat.
cloudflared_credentials_src: ""
cloudflared_gpg_key_url: "https://pkg.cloudflare.com/cloudflare-main.gpg"
# Codenames Cloudflare publishes cloudflared packages for. New releases lag here
# (e.g. Ubuntu 26.04 "resolute", Debian 13 "trixie") and Cloudflare stopped updating
# dists/bullseye at 2025.7.0 (EOL), so cloudflared_apt_release uses the host's native
# codename when current and otherwise falls back to the newest published LTS of the
# matching distro (Debian 11 falls back to bookworm). cloudflared is a static Go binary,
# so an older- or newer-codename package runs fine. Override with
# -e cloudflared_apt_release=<codename>.
cloudflared_supported_releases:
  - focal      # Ubuntu 20.04; target Python 3.9+ must be installed separately
  - jammy      # Ubuntu 22.04
  - noble      # Ubuntu 24.04
  - bookworm   # Debian 12 (also used as fallback for Debian 11 / 13)
cloudflared_apt_release: "{{ ansible_facts['distribution_release'] if ansible_facts['distribution_release'] in cloudflared_supported_releases else ('bookworm' if ansible_facts['distribution'] == 'Debian' else 'noble') }}"
